<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Schedule Sync</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @keyframes pulse-shadow-red {
      0%, 100% {
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        border-color: rgba(239, 68, 68, 0.6);
      }
      50% {
        box-shadow: 0 0 24px rgba(239, 68, 68, 1), inset 0 0 8px rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 1);
      }
    }
    .animate-pulse-shadow-urgent {
      animation: pulse-shadow-red 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .scroll-hide::-webkit-scrollbar {
      display: none;
    }
    .scroll-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    @keyframes audio-wave {
      0%, 100% { height: 6px; opacity: 0.6; }
      50% { height: 24px; opacity: 1; }
    }
    .wave-active {
      animation: audio-wave 1s infinite ease-in-out;
    }
    .wave-delay-0 { animation-delay: 0.0s; }
    .wave-delay-1 { animation-delay: 0.2s; }
    .wave-delay-2 { animation-delay: 0.4s; }
    .wave-delay-3 { animation-delay: 0.1s; }
    .wave-delay-4 { animation-delay: 0.3s; }
  </style>
</head>
<body class="min-h-screen bg-[#020617] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-black text-slate-200 font-sans selection:bg-emerald-500/30 overflow-hidden">
  
  <div id="app" class="max-w-6xl mx-auto flex flex-col h-screen max-h-screen">
    <header class="flex items-center justify-between p-4 sm:p-6 shrink-0 border-b border-slate-800/50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="calendar-sync" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-400">Schedule Sync</h1>
          <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Neural Link Active</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button id="tab-dashboard" onclick="state.activeTab = 'dashboard'; render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-all bg-slate-800 text-white shadow-md">Dashboard</button>
        <button id="tab-schedule" onclick="state.activeTab = 'schedule'; render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">Schedule</button>
      </div>
    </header>

    <main class="flex-1 overflow-hidden p-2 sm:p-4 lg:p-6" id="main-content">
      <!-- Content renders here -->
    </main>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script>
    let state = {
      shifts: [],
      activeTab: 'dashboard',
      scheduleSubTab: 'working',
      isListening: false,
      isProcessing: false,
      transcript: '',
      statusMsg: '',
      month: (new Date().getMonth() + 1).toString(),
      year: new Date().getFullYear().toString(),
      showQrModal: false,
      editingShift: null,
      toastMsg: '',
    };

    try {
      const saved = localStorage.getItem('vet_shifts_backup') || localStorage.getItem('schedule_sync_shifts');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) state.shifts = parsed;
      }
    } catch(e) {}

    const hash = window.location.hash;
    if (hash.startsWith('#sync=')) {
      try {
        const encodedData = hash.substring(6);
        const decodedStr = atob(decodeURIComponent(encodedData));
        const decodedData = JSON.parse(decodedStr);
        
        const restoredShifts = decodedData.map(s => ({
          id: Date.now().toString() + Math.random().toString(),
          start: s.d + 'T' + s.s,
          end: s.d + 'T' + s.e,
          title: s.u ? 'Urgent Care' : (s.t || 'Regular Shift'),
          details: s.r || '',
          colorCode: s.u ? 'red' : (s.c || 'blue')
        }));

        state.shifts = restoredShifts;
        localStorage.setItem('vet_shifts_backup', JSON.stringify(restoredShifts));
        
        window.history.replaceState(null, '', window.location.pathname);
        state.toastMsg = 'Shifts successfully synced to phone!';
        setTimeout(() => { state.toastMsg = ''; render(); }, 3000);
      } catch (e) {
        console.error('Failed to parse synced shifts:', e);
      }
    }

    function formatTime(rawStr) {
      if (!rawStr) return '';
      const parts = rawStr.split('T');
      if (parts.length !== 2) return rawStr;
      let [h, m] = parts[1].split(':');
      let hInt = parseInt(h, 10);
      let ampm = hInt >= 12 ? 'PM' : 'AM';
      hInt = hInt % 12;
      if (hInt === 0) hInt = 12;
      return `${hInt}:${m} ${ampm}`;
    }

    function renderShiftCard(shift) {
      const parts = shift.start.split('T');
      const [yearStr, monthStrNum, dayStrNum] = parts[0].split('-');
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const monthStr = monthNames[parseInt(monthStrNum, 10) - 1];
      const dayStr = dayStrNum;
      
      let borderColorClass = 'border-2 border-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.35)]';
      let textColorClass = 'text-blue-400';
      let label = 'REGULAR';
      let pulseClass = '';
      
      if (shift.colorCode === 'red') {
        borderColorClass = 'border-2 border-red-500';
        textColorClass = 'text-red-400';
        label = 'URGENT';
        pulseClass = 'animate-pulse-shadow-urgent';
      } else if (shift.colorCode === 'amber') {
        borderColorClass = 'border-2 border-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.35)]';
        textColorClass = 'text-amber-400';
        label = 'SURGERY';
      } else if (shift.colorCode === 'violet') {
        borderColorClass = 'border-2 border-purple-400 shadow-[0_0_10px_rgba(192,132,252,0.35)]';
        textColorClass = 'text-purple-400';
        label = 'DROP-OFF';
      }

      const hasRoomInfo = shift.details && /room/i.test(shift.details);

      return `
        <div class="p-2.5 sm:p-4 bg-slate-800/40 rounded-xl flex flex-row items-center gap-3 sm:gap-4 ${borderColorClass} transition-colors group ${pulseClass}">
          <div class="flex flex-col w-12 sm:w-14 min-w-[48px] sm:min-w-[56px] rounded-xl overflow-hidden border border-slate-700/80 shadow-md shrink-0 bg-slate-800/80">
            <div class="bg-red-500/90 text-white text-[8px] sm:text-[9px] font-bold uppercase tracking-widest text-center py-0.5 sm:py-1">
              ${monthStr}
            </div>
            <div class="flex items-center justify-center py-0.5 sm:py-1.5 bg-slate-900/50">
              <span class="text-base sm:text-xl font-bold text-white leading-tight">${dayStr}</span>
            </div>
          </div>
          
          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <div class="flex flex-col sm:flex-row sm:items-center gap-0.5 sm:gap-2">
              <h3 class="text-[13px] sm:text-lg font-medium text-white truncate leading-tight sm:leading-normal">${shift.title}</h3>
              <div class="flex flex-row items-center gap-2">
                ${hasRoomInfo ? `
                  <span class="text-amber-200 bg-amber-400/10 border border-amber-300/30 px-1.5 sm:px-2 py-0.5 rounded text-[9px] sm:text-xs truncate">
                    ${shift.details}
                  </span>
                ` : `
                  ${shift.details ? `<span class="text-slate-400 text-[10px] sm:text-sm truncate sm:border-l sm:border-slate-600 sm:pl-2">
                    ${shift.details}
                  </span>` : ''}
                `}
                <span class="w-max text-[8px] sm:text-[10px] px-1.5 sm:px-2 py-0.5 rounded-full border font-bold uppercase tracking-wider ${textColorClass} bg-current/10 border-current/30">
                  ${label}
                </span>
              </div>
            </div>
            <div class="text-[11px] sm:text-sm font-mono mt-0.5 sm:mt-1 text-emerald-400 leading-tight sm:leading-normal">
              ${formatTime(shift.start)} — ${formatTime(shift.end)}
            </div>
          </div>
          
          <div class="flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 shrink-0 pl-2">
            <button onclick="editShift('${shift.id}')" class="p-2 sm:p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-emerald-400 transition-all shadow-sm">
              <i data-lucide="edit-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </button>
            <button onclick="removeShift('${shift.id}')" class="p-2 sm:p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-red-400 transition-all shadow-sm">
              <i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    function renderDashboard(container) {
      const windowStart = new Date();
      windowStart.setHours(0, 0, 0, 0);
      const windowEnd = new Date(windowStart);
      windowEnd.setDate(windowStart.getDate() + 7);
      windowEnd.setHours(23, 59, 59, 999);
      
      const dashboardShifts = state.shifts.filter(s => {
        const d = new Date(s.start.replace('Z', ''));
        return d >= windowStart && d <= windowEnd;
      }).sort((a,b) => new Date(a.start.replace('Z', '')).getTime() - new Date(b.start.replace('Z', '')).getTime());

      let shiftsHtml = '';
      if (dashboardShifts.length === 0) {
        shiftsHtml = `
          <div class="h-full flex flex-col items-center justify-center text-slate-500 pb-10 mt-10">
            <i data-lucide="check-circle-2" class="w-12 h-12 mb-3 opacity-20"></i>
            <p class="font-mono text-sm uppercase tracking-widest text-slate-600 text-center">No shifts scheduled for the next 7 days</p>
          </div>
        `;
      } else {
        shiftsHtml = dashboardShifts.map(shift => renderShiftCard(shift)).join('');
      }

      let waveHtml = '';
      for(let i=0; i<5; i++) {
        waveHtml += `<div class="w-1 rounded-full transition-all duration-300 ${state.isListening ? 'bg-cyan-400 shadow-[0_0_12px_#22d3ee] wave-active wave-delay-' + i : 'bg-slate-700 h-1.5 opacity-50'}"></div>`;
      }

      const currentMonthName = new Date(0, parseInt(state.month) - 1).toLocaleString('default', { month: 'long' });
      const monthWorkingShifts = state.shifts.filter(s => {
        const d = new Date(s.start.replace('Z', ''));
        return (d.getMonth() + 1).toString() === state.month && d.getFullYear().toString() === state.year;
      });
      const exportDisabled = monthWorkingShifts.length === 0 ? 'disabled' : '';

      container.innerHTML = `
        <div class="h-full grid grid-cols-1 lg:grid-cols-12 grid-rows-none lg:grid-rows-6 gap-4 sm:gap-6 pb-20">
          
          <div class="col-span-1 lg:col-span-8 lg:row-span-6 bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl flex flex-col p-1 shadow-2xl relative overflow-hidden order-1">
            <div class="p-4 border-b border-slate-800/50 flex justify-between items-center shrink-0">
              <h2 class="text-sm font-mono uppercase tracking-widest text-slate-400">Shift Matrix (Next 7 Days)</h2>
              <div class="flex gap-2">
                <span class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-mono">
                  ${dashboardShifts.length} UPCOMING
                </span>
              </div>
            </div>
            <div class="flex-1 p-2 sm:p-4 space-y-1.5 sm:space-y-4 overflow-y-auto scroll-hide">
              ${shiftsHtml}
            </div>
          </div>

          <div class="col-span-1 lg:col-span-4 lg:row-span-4 bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl p-6 flex flex-col shadow-2xl relative order-2 shrink-0">
            <div class="absolute top-4 right-4">
              <div class="w-2 h-2 rounded-full ${state.isListening ? 'bg-red-500 shadow-[0_0_10px_#ef4444] animate-pulse' : 'bg-violet-500 shadow-[0_0_10px_#a855f7]'}"></div>
            </div>
            <h2 class="text-sm font-mono uppercase tracking-widest text-slate-400 mb-6 shrink-0">Input Interface</h2>
            <div class="flex-1 flex flex-col gap-4 min-h-[220px]">
              <div class="relative group flex-1 flex flex-col">
                <textarea
                  id="transcript-input"
                  class="w-full h-full min-h-[120px] bg-slate-950/50 border border-slate-800 rounded-2xl p-4 pb-14 text-sm text-slate-200 focus:outline-none focus:border-violet-500/50 transition-all placeholder:text-slate-700 resize-none custom-scrollbar"
                  placeholder="PASTE SCHEDULE DATA OR SPEAK..."
                >${state.transcript}</textarea>
                <div class="absolute bottom-4 right-4 flex gap-2">
                  <button
                    onclick="toggleListening()"
                    class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center transition-all ${state.isListening ? 'text-red-400 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'text-slate-400 hover:text-white hover:border-violet-500/50'}"
                  >
                    ${state.isListening ? '<i data-lucide="square" class="w-4 h-4 fill-current"></i>' : '<i data-lucide="mic" class="w-5 h-5"></i>'}
                  </button>
                </div>
              </div>
              <button
                onclick="processTranscript()"
                ${state.isProcessing ? 'disabled' : ''}
                class="w-full py-4 bg-gradient-to-r from-violet-600 to-emerald-600 rounded-2xl text-white font-bold uppercase tracking-widest text-xs shadow-lg shadow-violet-900/20 active:scale-[0.98] transition-transform disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shrink-0"
              >
                ${state.isProcessing ? '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing Neural Feed' : 'Process Neural Feed'}
              </button>
              ${state.statusMsg ? `<div class="mt-2 text-center text-xs font-mono text-emerald-400 p-2 bg-slate-900/50 rounded border border-emerald-500/20">${state.statusMsg}</div>` : ''}
            </div>
            <div class="mt-6 pt-6 border-t border-slate-800/50 shrink-0">
              <div class="flex items-center justify-center gap-1.5 h-6 mb-3">
                ${waveHtml}
              </div>
              <div class="flex justify-between items-center text-[10px] font-mono text-slate-500 uppercase">
                <span>Memory Buffer</span>
                <span>${(state.transcript.length / 1024).toFixed(3)} KB</span>
              </div>
              <div class="w-full h-1 bg-slate-800 rounded-full mt-2 overflow-hidden">
                <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${Math.min(100, (state.transcript.length / 5000) * 100)}%"></div>
              </div>
            </div>
          </div>

          <div class="col-span-1 lg:col-span-4 lg:row-span-2 bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl p-6 flex flex-col justify-between shadow-2xl order-3 shrink-0">
            <h2 class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-4 lg:mb-0">Export Protocol</h2>
            <div class="grid grid-cols-2 gap-4 mt-auto">
              <button 
                onclick="exportCalendar()"
                ${exportDisabled}
                class="flex flex-col items-center gap-2 p-3 bg-slate-800/50 border border-slate-700/50 rounded-xl hover:border-emerald-500/50 transition-all group disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <i data-lucide="download" class="w-5 h-5 text-emerald-400 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-mono uppercase text-slate-300 text-center leading-tight">Export ${currentMonthName} Shifts<br/>(.ics)</span>
              </button>
              
              <button 
                onclick="openQrModal()"
                class="flex flex-col items-center gap-2 p-3 bg-slate-800/50 border border-slate-700/50 rounded-xl cursor-pointer group transition-all duration-150 active:scale-95 hover:border-cyan-400/70 hover:bg-cyan-500/10 hover:shadow-[0_0_12px_rgba(34,211,238,0.3)]"
                title="Sync to Phone"
              >
                <i data-lucide="smartphone" class="w-5 h-5 text-violet-400 transition-colors group-hover:text-cyan-300"></i>
                <span class="text-[10px] font-mono uppercase text-slate-300 transition-colors group-hover:text-cyan-300 text-center leading-tight">
                  Sync to Phone<br/>(QR Code)
                </span>
              </button>
            </div>
          </div>
        </div>
      `;

      const ta = document.getElementById('transcript-input');
      if (ta) {
        ta.addEventListener('input', (e) => {
          state.transcript = e.target.value;
          const kb = (state.transcript.length / 1024).toFixed(3);
          const spans = document.querySelectorAll('.text-\\[10px\\].font-mono.text-slate-500.uppercase span');
          if (spans.length > 1) spans[1].innerText = kb + ' KB';
          const progress = document.querySelector('.bg-emerald-500.transition-all');
          if (progress) progress.style.width = Math.min(100, (state.transcript.length / 5000) * 100) + '%';
        });
      }
    }

    function renderSchedule(container) {
      const y = parseInt(state.year);
      const m = parseInt(state.month) - 1;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      
      const monthWorkingShifts = state.shifts.filter(s => {
        const d = new Date(s.start.replace('Z', ''));
        return d.getMonth() === m && d.getFullYear() === y;
      }).sort((a,b) => new Date(a.start.replace('Z', '')).getTime() - new Date(b.start.replace('Z', '')).getTime());

      const daysOff = [];
      for(let i=1; i<=daysInMonth; i++) {
        const currentDate = new Date(y, m, i);
        const hasShift = monthWorkingShifts.some(s => {
          const d = new Date(s.start.replace('Z', ''));
          return d.getDate() === i;
        });
        if(!hasShift) {
          daysOff.push(currentDate);
        }
      }

      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      let monthOptions = '';
      months.forEach((name, i) => {
        monthOptions += `<option value="${i+1}" ${state.month == (i+1) ? 'selected' : ''}>${name}</option>`;
      });

      let contentHtml = '';
      if (state.scheduleSubTab === 'working') {
        if (monthWorkingShifts.length === 0) {
          contentHtml = `
            <div class="flex flex-col items-center justify-center text-slate-500 py-20 mt-10">
               <i data-lucide="check-circle-2" class="w-12 h-12 mb-3 opacity-20"></i>
               <p class="font-mono text-sm uppercase tracking-widest text-slate-600 text-center">No shifts scheduled for this month</p>
            </div>
          `;
        } else {
          contentHtml = `<div class="space-y-4">` + monthWorkingShifts.map(s => renderShiftCard(s)).join('') + `</div>`;
        }
      } else {
        contentHtml = `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">` + daysOff.map(date => `
          <div class="p-4 bg-slate-800/20 border border-slate-700/30 rounded-2xl flex flex-col items-center justify-center text-center gap-1 hover:border-cyan-500/30 transition-colors">
            <span class="text-[10px] uppercase font-mono text-slate-500">${date.toLocaleDateString('en-US', { weekday: 'short' })}</span>
            <span class="text-2xl font-bold text-slate-400">${date.getDate()}</span>
            <span class="text-[10px] uppercase font-mono text-cyan-500/70 bg-cyan-500/10 px-2 py-0.5 rounded-full mt-1 border border-cyan-500/20">OFF</span>
          </div>
        `).join('') + `</div>`;
      }

      container.innerHTML = `
        <div class="h-full bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl flex flex-col p-1 shadow-2xl overflow-hidden">
          <div class="p-4 border-b border-slate-800/50 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0">
            <div class="flex items-center gap-3">
              <select 
                onchange="state.month = this.value; render();"
                class="bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500 text-sm font-medium"
              >
                ${monthOptions}
              </select>
              <select 
                onchange="state.year = this.value; render();"
                class="bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-1.5 focus:outline-none focus:border-cyan-500 text-sm font-medium"
              >
                <option value="2024" ${state.year === '2024' ? 'selected' : ''}>2024</option>
                <option value="2025" ${state.year === '2025' ? 'selected' : ''}>2025</option>
                <option value="2026" ${state.year === '2026' ? 'selected' : ''}>2026</option>
                <option value="2027" ${state.year === '2027' ? 'selected' : ''}>2027</option>
              </select>
            </div>
            
            <div class="flex bg-slate-950 p-1 rounded-lg">
              <button 
                onclick="state.scheduleSubTab = 'working'; render();" 
                class="px-4 py-1.5 rounded-md text-sm font-medium tracking-wide transition-all ${state.scheduleSubTab === 'working' ? 'bg-slate-800 text-blue-400 shadow-sm' : 'text-slate-500 hover:text-slate-300'}"
              >
                Working (${monthWorkingShifts.length})
              </button>
              <button 
                onclick="state.scheduleSubTab = 'off'; render();" 
                class="px-4 py-1.5 rounded-md text-sm font-medium tracking-wide transition-all ${state.scheduleSubTab === 'off' ? 'bg-slate-800 text-cyan-400 shadow-sm' : 'text-slate-500 hover:text-slate-300'}"
              >
                Days Off (${daysOff.length})
              </button>
            </div>
          </div>
          
          <div class="flex-1 p-4 overflow-y-auto scroll-hide">
            ${contentHtml}
          </div>
        </div>
      `;
    }

        function renderModals() {
      const modalContainer = document.getElementById('modal-container');
      let html = '';

      if (state.showQrModal) {
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
            <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-sm w-full flex flex-col items-center shadow-2xl shadow-cyan-900/20 relative">
              <button onclick="closeQrModal()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-white bg-slate-800 rounded-full transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
              <h3 class="text-xl font-bold text-white mb-2">Sync to Phone</h3>
              <p class="text-sm text-slate-400 text-center mb-8">Scan this QR code with your phone's camera to instantly import your entire schedule.</p>
              <div class="bg-white p-4 rounded-2xl mb-8">
                <div id="qrcode"></div>
              </div>
              <button onclick="closeQrModal()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-700 transition-colors">Done</button>
            </div>
          </div>
        `;
      }

      if (state.editingShift) {
        const shift = state.editingShift;
        html += `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeEditModal()"></div>
            <div class="relative w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
              <div class="flex items-center justify-between p-4 border-b border-slate-800">
                <h3 class="text-lg font-medium text-white flex items-center gap-2">
                  <i data-lucide="edit-2" class="w-4 h-4 text-emerald-400"></i> Edit Schedule Entry
                </h3>
                <button onclick="closeEditModal()" class="text-slate-500 hover:text-white transition-colors">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>
              </div>
              <form onsubmit="saveEditedShift(event)" class="p-6 space-y-4">
                <div>
                  <label class="block text-[10px] font-mono uppercase text-slate-500 mb-1">Title</label>
                  <input type="text" id="edit-title" value="${shift.title.replace(/"/g, '&quot;')}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50" required>
                </div>
                <div>
                  <label class="block text-[10px] font-mono uppercase text-slate-500 mb-1">Details (Room, Location)</label>
                  <input type="text" id="edit-details" value="${shift.details ? shift.details.replace(/"/g, '&quot;') : ''}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50">
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-[10px] font-mono uppercase text-slate-500 mb-1">Start Time</label>
                    <input type="datetime-local" id="edit-start" value="${shift.start.slice(0, 16)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50 text-sm" required>
                  </div>
                  <div>
                    <label class="block text-[10px] font-mono uppercase text-slate-500 mb-1">End Time</label>
                    <input type="datetime-local" id="edit-end" value="${shift.end.slice(0, 16)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500/50 text-sm" required>
                  </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                  <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 rounded-xl text-slate-400 font-medium hover:text-white hover:bg-slate-800 transition-colors">Cancel</button>
                  <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold transition-colors">Save Changes</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }
      modalContainer.innerHTML = html;

      if (state.showQrModal) {
        const qrContainer = document.getElementById('qrcode');
        if (qrContainer) {
          qrContainer.innerHTML = '';
          if (typeof QRCode === 'undefined') {
            alert("QR Library failed to load.");
          } else {
            const compactShifts = state.shifts.map(s => {
              const [dateStr, startTime] = s.start.split('T');
              const endTime = s.end.split('T')[1];
              return {
                d: dateStr,
                s: startTime,
                e: endTime,
                r: s.details || '',
                u: (s.colorCode === 'red' || s.title.includes('Urgent')) ? 1 : 0,
                t: s.title,
                c: s.colorCode
              };
            });
            const encodedData = encodeURIComponent(btoa(JSON.stringify(compactShifts)));
            const syncUrl = window.location.origin + window.location.pathname + '#sync=' + encodedData;
            
            new QRCode(qrContainer, {
              text: syncUrl,
              width: 256,
              height: 256,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L
            });
          }
        }
      }
    }

    function renderToast() {
      const toastContainer = document.getElementById('toast-container');
      if (state.toastMsg) {
        toastContainer.innerHTML = `
          <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-500/20 backdrop-blur-md border border-emerald-500/50 text-emerald-400 px-6 py-3 rounded-full flex items-center gap-3 shadow-lg shadow-emerald-500/20 transition-opacity">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
            <span class="font-medium text-sm">${state.toastMsg}</span>
          </div>
        `;
      } else {
        toastContainer.innerHTML = '';
      }
    }

    function render() {
      const tabDash = document.getElementById('tab-dashboard');
      const tabSched = document.getElementById('tab-schedule');
      if(state.activeTab === 'dashboard') {
        tabDash.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all bg-slate-800 text-white shadow-md";
        tabSched.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/50";
      } else {
        tabSched.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all bg-slate-800 text-white shadow-md";
        tabDash.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/50";
      }

      const mainContent = document.getElementById('main-content');
      if(state.activeTab === 'dashboard') {
        renderDashboard(mainContent);
      } else {
        renderSchedule(mainContent);
      }

      renderModals();
      renderToast();
      lucide.createIcons();
    }

    let recognition = null;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      
      recognition.onresult = (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
          }
        }
        if (finalTranscript) {
          state.transcript += (state.transcript ? ' ' : '') + finalTranscript.trim();
          render();
        }
      };

      recognition.onerror = (event) => {
        console.error('Speech error:', event.error);
        state.isListening = false;
        render();
      };

      recognition.onend = () => {
        state.isListening = false;
        render();
      };
    }

    window.toggleListening = function() {
      if (state.isListening) {
        if (recognition) recognition.stop();
        state.isListening = false;
      } else {
        if (recognition) {
          try {
            recognition.start();
            state.isListening = true;
          } catch(e) {
            console.error(e);
          }
        } else {
          alert('Web Speech API is not supported in this browser.');
        }
      }
      render();
    };

    window.processTranscript = function() {
      if (state.isListening || !state.transcript.trim()) return;

      state.isProcessing = true;
      state.statusMsg = 'Processing Neural Feed locally...';
      render();

      setTimeout(() => {
        let text = state.transcript.toLowerCase();
        
        // Homophone and phrasing cleanup for time parsing
        text = text.replace(/\bto\b/g, '-');
        text = text.replace(/\btill\b/g, '-');
        text = text.replace(/\buntil\b/g, '-');
        text = text.replace(/\bthru\b/g, '-');
        text = text.replace(/\bfor\b/g, '4');
        text = text.replace(/\bwon\b/g, '1');
        text = text.replace(/\bone\b/g, '1');
        text = text.replace(/\btoo\b/g, '2');
        text = text.replace(/\btwo\b/g, '2');
        text = text.replace(/\bthree\b/g, '3');
        text = text.replace(/\bfour\b/g, '4');
        text = text.replace(/\bfive\b/g, '5');

        // Robust date boundary anchor regex
        // Matches: month+day | mm/dd | dayname+day | standalone ordinals
        const dateRegex = /\b(?:(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember|t)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+\d{1,2}(?:st|nd|rd|th)?|\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?|(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?:\s+the)?\s+\d{1,2}(?:st|nd|rd|th)?|(?:on\s+)?(?:the\s+)?\d{1,2}(?:st|nd|rd|th))\b/gi;

        // Use matchAll to avoid skipped regex lastIndex bugs
        let matches = [...text.matchAll(dateRegex)];
        let chunks = [];
        
        if (matches.length === 0) {
          chunks.push(text);
        } else {
          if (matches[0].index > 0) {
            let preText = text.substring(0, matches[0].index).trim();
            if (preText.length > 5) chunks.push(preText);
          }
          for (let i = 0; i < matches.length; i++) {
            let start = matches[i].index;
            let end = (i + 1 < matches.length) ? matches[i+1].index : text.length;
            chunks.push(text.substring(start, end));
          }
        }

        const currentYear = parseInt(state.year) || new Date().getFullYear();
        let currentMonth = parseInt(state.month) - 1; // Carry forward the UI active month by default
        let newShiftsCount = 0;

        chunks.forEach(chunk => {
          chunk = chunk.trim();
          if (!chunk) return;

          let day = null;
          
          // 1. Month Extractor
          const monthMatch = chunk.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember|t)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i);
          if (monthMatch) {
            const mStr = monthMatch[1].toLowerCase();
            const monthMap = { jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3, may:4, jun:5, june:5, jul:6, july:6, aug:7, august:7, sep:8, sept:8, september:8, oct:9, october:9, nov:10, november:10, dec:11, december:11 };
            if (monthMap[mStr] !== undefined) {
              currentMonth = monthMap[mStr]; // Keep carrying forward
            }
          } else {
             const numMatch = chunk.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
             if (numMatch) {
                 currentMonth = parseInt(numMatch[1]) - 1;
             }
          }

          // 2. Day Extractor
          const numMatch = chunk.match(/\b\d{1,2}[\/\-](\d{1,2})(?:[\/\-]\d{2,4})?\b/);
          const ordinalMatch = chunk.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i);
          const plainDayMatch = chunk.match(/\b(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember|t)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2})\b/i);

          if (numMatch) {
            day = parseInt(numMatch[1]);
          } else if (ordinalMatch) {
            day = parseInt(ordinalMatch[1]);
          } else if (plainDayMatch) {
            day = parseInt(plainDayMatch[1]);
          }

          // 3. Time Extractor (Non-greedy inherent due to anchor blocks)
          const timeMatch = chunk.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?\s*-\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?\b/i);

          if (day === null && !timeMatch) {
            console.warn("DEBUG: Skipping chunk (no date/time found):", chunk);
            return;
          }
          if (!timeMatch) {
            console.warn("DEBUG: Skipping chunk (no valid time string found):", chunk);
            return; 
          }
          
          if (day === null) day = new Date().getDate();

          let startH = parseInt(timeMatch[1]);
          let startM = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
          let startPeriod = timeMatch[3] ? timeMatch[3].toLowerCase() : null;
          
          let endH = parseInt(timeMatch[4]);
          let endM = timeMatch[5] ? parseInt(timeMatch[5]) : 0;
          let endPeriod = timeMatch[6] ? timeMatch[6].toLowerCase() : null;

          // Inference constraints
          if (!startPeriod) {
            if (startH >= 6 && startH <= 11) startPeriod = 'am';
            else if (startH === 12 || startH < 6) startPeriod = 'pm';
          }
          if (!endPeriod) {
            if (endH >= 1 && endH <= 11) endPeriod = 'pm';
            else if (endH === 12) endPeriod = 'pm';
          }
          
          if (startPeriod && startPeriod.startsWith('p') && startH < 12) startH += 12;
          if (startPeriod && startPeriod.startsWith('a') && startH === 12) startH = 0;
          
          if (endPeriod && endPeriod.startsWith('p') && endH < 12) endH += 12;
          if (endPeriod && endPeriod.startsWith('a') && endH === 12) endH = 0;

          // 4. Room and Flag Extractor
          let details = '';
          const roomMatch = chunk.match(/\broom\s+([a-z0-9]+)\b/i);
          const isoMatch = chunk.match(/\biso\b/i);
          const dentalMatch = chunk.match(/\bdental\b/i);
          const frontDeskMatch = chunk.match(/\bfront desk\b/i);
          
          if (roomMatch) details = 'Room ' + roomMatch[1].toUpperCase();
          else if (isoMatch) details = 'ISO';
          else if (dentalMatch) details = 'Dental';
          else if (frontDeskMatch) details = 'Front Desk';

          let colorCode = 'blue';
          let title = 'Regular Shift';
          
          if (chunk.match(/\b(urgent care|urgent|uc)\b/)) {
            colorCode = 'red';
            title = 'Urgent Care';
          } else if (chunk.match(/\bsurgery\b/)) {
            colorCode = 'amber';
            title = 'Surgery';
          } else if (chunk.match(/\bdrop(?:\s*off|s)?\b/)) {
            colorCode = 'violet';
            title = 'Drop-Offs';
          } else if (chunk.match(/\bexam(s)?\b/)) {
            title = 'Exams';
          }

          const pad = n => n.toString().padStart(2, '0');
          let startIso = `${currentYear}-${pad(currentMonth + 1)}-${pad(day)}T${pad(startH)}:${pad(startM)}`;
          let endIso = `${currentYear}-${pad(currentMonth + 1)}-${pad(day)}T${pad(endH)}:${pad(endM)}`;

          state.shifts.push({
            id: Date.now().toString() + Math.random().toString(),
            title: title,
            details: details,
            colorCode: colorCode,
            start: startIso,
            end: endIso
          });
          newShiftsCount++;
        });

        state.transcript = '';
        state.isProcessing = false;
        state.statusMsg = '';
        state.toastMsg = `Successfully added ${newShiftsCount} shifts.`;
        localStorage.setItem('vet_shifts_backup', JSON.stringify(state.shifts));
        
        render();

        setTimeout(() => {
          state.toastMsg = '';
          render();
        }, 4000);
      }, 800);
    };

    window.openQrModal = function() {
      state.showQrModal = true;
      render();
    };

    window.closeQrModal = function() {
      state.showQrModal = false;
      render();
    };

    window.editShift = function(id) {
      state.editingShift = state.shifts.find(s => s.id === id);
      render();
    };

    window.closeEditModal = function() {
      state.editingShift = null;
      render();
    };

    window.removeShift = function(id) {
      state.shifts = state.shifts.filter(s => s.id !== id);
      localStorage.setItem('vet_shifts_backup', JSON.stringify(state.shifts));
      render();
    };

    window.saveEditedShift = function(e) {
      e.preventDefault();
      if(!state.editingShift) return;
      
      state.editingShift.title = document.getElementById('edit-title').value;
      state.editingShift.details = document.getElementById('edit-details').value;
      state.editingShift.start = document.getElementById('edit-start').value;
      state.editingShift.end = document.getElementById('edit-end').value;
      
      state.shifts = state.shifts.map(s => s.id === state.editingShift.id ? state.editingShift : s);
      localStorage.setItem('vet_shifts_backup', JSON.stringify(state.shifts));
      
      state.editingShift = null;
      render();
    };

    window.exportCalendar = function() {
      const shiftsToExport = state.shifts.filter(s => {
        const parts = s.start.split('T');
        const [yearStr, monthStrNum] = parts[0].split('-');
        return parseInt(monthStrNum, 10).toString() === state.month && yearStr === state.year;
      });

      if (shiftsToExport.length === 0) {
        alert('No shifts to export for this month.');
        return;
      }
      
      let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ScheduleSync//EN\r\n';
      shiftsToExport.forEach(shift => {
        const start = shift.start.replace(/[-:]/g, '') + '00';
        const end = shift.end.replace(/[-:]/g, '') + '00';
        
        ics += 'BEGIN:VEVENT\r\n';
        ics += `UID:${shift.id}@schedulesync\r\n`;
        ics += `DTSTAMP:${start}\r\n`;
        ics += `DTSTART:${start}\r\n`;
        ics += `DTEND:${end}\r\n`;
        ics += `SUMMARY:${shift.title}\r\n`;
        ics += `DESCRIPTION:${shift.details}\r\n`;
        ics += 'END:VEVENT\r\n';
      });
      ics += 'END:VCALENDAR';
      
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const currentMonthName = new Date(0, parseInt(state.month) - 1).toLocaleString('default', { month: 'long' });
      a.download = `shifts-${currentMonthName.toLowerCase()}-${state.year}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    };

    // Initialize
    render();
  </script>
</body>
</html>
