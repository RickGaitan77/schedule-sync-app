<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Schedule Assistant</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --urgent: #f43f5e;
            --urgent-glow: rgba(244, 63, 94, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 6px 0;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recorder-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        #micBtn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        #micBtn.recording {
            background: var(--urgent);
            box-shadow: 0 0 15px var(--urgent-glow);
            animation: pulse 1.5s infinite;
        }

        #processBtn {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        #processBtn:hover {
            opacity: 0.9;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .shift-row {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .shift-row.has-shift {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .shift-row.urgent-care {
            background: rgba(244, 63, 94, 0.08);
            border-color: rgba(244, 63, 94, 0.3);
        }

        .day-info {
            flex-shrink: 0;
            min-width: 85px;
        }

        .day-info .day-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .day-info .day-date {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .shift-details {
            text-align: right;
            flex-grow: 1;
            min-width: 0;
        }

        .shift-type {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .shift-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: normal;
            word-break: break-word;
        }

        .actions-footer {
            display: flex;
            gap: 10px;
        }

        #exportBtn {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #clearBtn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }

        #clearBtn:hover {
            color: var(--urgent);
            border-color: var(--urgent);
        }

        .status-msg {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vet Schedule Assistant</h1>
            <p>Voice-to-Schedule Engine</p>
        </header>

        <!-- 1. Scheduled Shifts Module -->
        <div class="glass-card">
            <div class="section-title">
                <span>Scheduled Shifts</span>
                <span id="syncStatus" style="font-size: 0.75rem; color: #10b981;">Synced</span>
            </div>
            <div id="scheduleGrid" class="schedule-grid">
                <!-- Dynamically populated view -->
            </div>
        </div>

        <!-- 2. Dictate Schedule Module -->
        <div class="glass-card">
            <div class="section-title">
                <span>Dictate Schedule</span>
                <span id="micStatus" style="font-size: 0.75rem; color: var(--accent);">Ready</span>
            </div>
            <div class="recorder-box">
                <textarea id="transcriptBox" placeholder="Tap microphone and speak your shifts (e.g., 'On September 1st, 7:30 to 6:00 room 5...')..."></textarea>
                <div class="controls">
                    <button id="micBtn">🎙️ Record</button>
                    <button id="processBtn">✨ Process Shifts</button>
                </div>
            </div>
        </div>

        <!-- 3. Export & Management Module -->
        <div class="glass-card" style="padding: 12px 16px;">
            <div class="actions-footer">
                <button id="exportBtn">📥 Export .ics Calendar</button>
                <button id="clearBtn">Clear All</button>
            </div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const transcriptBox = document.getElementById('transcriptBox');
        const micBtn = document.getElementById('micBtn');
        const processBtn = document.getElementById('processBtn');
        const exportBtn = document.getElementById('exportBtn');
        const clearBtn = document.getElementById('clearBtn');
        const scheduleGrid = document.getElementById('scheduleGrid');
        const micStatus = document.getElementById('micStatus');
        const statusMsg = document.getElementById('statusMsg');

        let currentShifts = [];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = '⏹️ Stop';
                micStatus.textContent = 'Listening...';
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    }
                }
                if (finalTranscript) {
                    transcriptBox.value += (transcriptBox.value ? ' ' : '') + finalTranscript.trim();
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };
        } else {
            micBtn.style.display = 'none';
            micStatus.textContent = 'Voice not supported';
        }

        function stopRecording() {
            if (isRecording && recognition) {
                recognition.stop();
            }
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎙️ Record';
            micStatus.textContent = 'Ready';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecording) {
                stopRecording();
            } else {
                recognition.start();
            }
        });

        async function fetchSchedule() {
            try {
                const res = await fetch('/api/get-schedule');
                const data = await res.json();
                if (data.success && data.shifts && data.shifts.length > 0) {
                    currentShifts = data.shifts;
                    localStorage.setItem('vet_shifts_backup', JSON.stringify(currentShifts));
                } else {
                    // Fallback to browser memory if server was reset
                    const localBackup = localStorage.getItem('vet_shifts_backup');
                    if (localBackup) {
                        currentShifts = JSON.parse(localBackup);
                        // Re-sync local backup back to server automatically
                        await saveToServer(currentShifts);
                    } else {
                        currentShifts = [];
                    }
                }
                renderScheduleView();
            } catch (err) {
                const localBackup = localStorage.getItem('vet_shifts_backup');
                currentShifts = localBackup ? JSON.parse(localBackup) : [];
                renderScheduleView();
            }
        }

        async function saveToServer(shifts) {
            try {
                await fetch('/api/update-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shifts })
                });
            } catch (err) {
                console.error('Server sync failed', err);
            }
        }

        function renderScheduleView() {
            scheduleGrid.innerHTML = '';

            // Automatically maintain local storage backup on render view update
            if (currentShifts && currentShifts.length > 0) {
                localStorage.setItem('vet_shifts_backup', JSON.stringify(currentShifts));
            } else {
                localStorage.removeItem('vet_shifts_backup');
            }

            if (!currentShifts || currentShifts.length === 0) {
                scheduleGrid.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 15px; font-size: 0.85rem;">No shifts scheduled yet.</div>';
                return;
            }

            currentShifts.forEach((shift) => {
                const d = new Date(shift.date);
                const row = document.createElement('div');
                const isUrgent = shift.shiftType === 'Urgent Care';
                row.className = `shift-row ${isUrgent ? 'urgent-care' : 'has-shift'}`;

                const dayNameStr = d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
                // Omitting the redundant year saves horizontal space on mobile:
                const monthDayStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

                // Format room words to numbers (e.g. "Room Five" -> "Rm 5")
                let cleanDetails = shift.details || '';
                const wordToNum = {
                    'one': '1', 'two': '2', 'three': '3', 'four': '4', 'five': '5',
                    'six': '6', 'seven': '7', 'eight': '8', 'nine': '9', 'ten': '10'
                };
                cleanDetails = cleanDetails.replace(/\b(?:room|rm)\s+(one|two|three|four|five|six|seven|eight|nine|ten|\d+)\b/gi, (match, p1) => {
                    const num = wordToNum[p1.toLowerCase()] || p1;
                    return `Rm ${num}`;
                });

                row.innerHTML = `
                    <div class="day-info">
                        <div class="day-name">${dayNameStr}</div>
                        <div class="day-date">${monthDayStr}</div>
                    </div>
                    <div class="shift-details">
                        <div class="shift-type">${shift.shiftType}</div>
                        <div class="shift-time">${cleanDetails}</div>
                    </div>
                `;
                scheduleGrid.appendChild(row);
            });

        processBtn.addEventListener('click', async () => {
            const text = transcriptBox.value.trim();
            if (!text) {
                statusMsg.textContent = 'Please record or type your shifts first.';
                return;
            }

            let targetMonth = 7;
            const lower = text.toLowerCase();
            if (lower.includes('september')) targetMonth = 8;
            else if (lower.includes('october')) targetMonth = 9;
            else if (lower.includes('november')) targetMonth = 10;
            else if (lower.includes('december')) targetMonth = 11;
            else if (lower.includes('january')) targetMonth = 0;
            else if (lower.includes('february')) targetMonth = 1;
            else if (lower.includes('march')) targetMonth = 2;
            else if (lower.includes('april')) targetMonth = 3;
            else if (lower.includes('may')) targetMonth = 4;
            else if (lower.includes('june')) targetMonth = 5;
            else if (lower.includes('july')) targetMonth = 6;

            statusMsg.textContent = 'Parsing shifts...';
            try {
                const res = await fetch('/api/parse-voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text, 
                        year: 2026, 
                        month: targetMonth 
                    })
                });
                const data = await res.json();
                if (data.success) {
                    currentShifts = data.shifts;
                    renderScheduleView();
                    statusMsg.textContent = 'Shifts successfully parsed and saved!';
                    transcriptBox.value = '';
                } else {
                    statusMsg.textContent = 'Error: ' + data.error;
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Failed to connect to server.';
            }
        });

        exportBtn.addEventListener('click', () => {
            window.location.href = '/api/export-calendar';
        });

        clearBtn.addEventListener('click', async () => {
            if (!confirm('Clear all saved shifts?')) return;
            try {
                const res = await fetch('/api/update-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shifts: [] })
                });
                const data = await res.json();
                if (data.success) {
                    currentShifts = [];
                    renderScheduleView();
                    statusMsg.textContent = 'All shifts cleared.';
                }
            } catch (err) {
                console.error(err);
            }
        });

        fetchSchedule();
    </script>
</body>
</html>
