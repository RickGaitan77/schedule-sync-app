<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Schedule Assistant</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --urgent: #f43f5e;
            --urgent-glow: rgba(244, 63, 94, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Frosted Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Voice Recorder Area */
        .recorder-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #micBtn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        #micBtn.recording {
            background: var(--urgent);
            box-shadow: 0 0 15px var(--urgent-glow);
            animation: pulse 1.5s infinite;
        }

        #processBtn {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        #processBtn:hover {
            opacity: 0.9;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* 7-Day Shift Grid */
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shift-row {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .shift-row.has-shift {
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .shift-row.urgent-care {
            background: rgba(244, 63, 94, 0.08);
            border-color: rgba(244, 63, 94, 0.3);
        }

        .day-info .day-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .day-info .day-date {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .shift-details {
            text-align: right;
        }

        .shift-type {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .shift-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Action Footer */
        .actions-footer {
            display: flex;
            gap: 10px;
        }

        #exportBtn {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #clearBtn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }

        #clearBtn:hover {
            color: var(--urgent);
            border-color: var(--urgent);
        }

        .status-msg {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vet Schedule Assistant</h1>
            <p>Voice-to-Schedule Engine</p>
        </header>

        <!-- Voice Input Card -->
        <div class="glass-card">
            <div class="section-title">
                <span>Dictate Schedule</span>
                <span id="micStatus" style="font-size: 0.75rem; color: var(--accent);">Ready</span>
            </div>
            <div class="recorder-box">
                <textarea id="transcriptBox" placeholder="Tap microphone and speak your shifts (e.g., 'On the 28th, 7:30 to 6:00, room two...')..."></textarea>
                <div class="controls">
                    <button id="micBtn">🎙️ Record</button>
                    <button id="processBtn">✨ Process Shifts</button>
                </div>
            </div>
        </div>

        <!-- 7-Day View Card -->
        <div class="glass-card">
            <div class="section-title">
                <span>Upcoming 7-Day Schedule</span>
                <span id="syncStatus" style="font-size: 0.75rem; color: #10b981;">Synced</span>
            </div>
            <div id="scheduleGrid" class="schedule-grid">
                <!-- Dynamically populated 7-day view -->
            </div>
        </div>

        <!-- Export & Management Card -->
        <div class="glass-card" style="padding: 14px 20px;">
            <div class="actions-footer">
                <button id="exportBtn">📥 Export .ics Calendar</button>
                <button id="clearBtn">Clear All</button>
            </div>
        </div>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        const transcriptBox = document.getElementById('transcriptBox');
        const micBtn = document.getElementById('micBtn');
        const processBtn = document.getElementById('processBtn');
        const exportBtn = document.getElementById('exportBtn');
        const clearBtn = document.getElementById('clearBtn');
        const scheduleGrid = document.getElementById('scheduleGrid');
        const micStatus = document.getElementById('micStatus');
        const statusMsg = document.getElementById('statusMsg');

        let currentShifts = [];

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = '⏹️ Stop';
                micStatus.textContent = 'Listening...';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                if (finalTranscript) {
                    transcriptBox.value += (transcriptBox.value ? ' ' : '') + finalTranscript.trim();
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };
        } else {
            micBtn.style.display = 'none';
            micStatus.textContent = 'Voice not supported in browser';
        }

        function stopRecording() {
            if (isRecording && recognition) {
                recognition.stop();
            }
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎙️ Record';
            micStatus.textContent = 'Ready';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecording) {
                stopRecording();
            } else {
                recognition.start();
            }
        });

        // Load saved schedule from server on boot
        async function fetchSchedule() {
            try {
                const res = await fetch('/api/get-schedule');
                const data = await res.json();
                if (data.success) {
                    currentShifts = data.shifts || [];
                    render7DayView();
                }
            } catch (err) {
                console.error('Failed to load schedule', err);
            }
        }

        // Render upcoming 7 days starting from today or August 2026 anchor
        function render7DayView() {
            scheduleGrid.innerHTML = '';
            
            // Generate next 7 days for display
            const today = new Date();
            // If testing around August 2026, we can anchor or use real local date
            for (let i = 0; i < 7; i++) {
                const d = new Date();
                d.setDate(today.getDate() + i);
                
                // Match against saved shifts
                const matchedShift = currentShifts.find(s => {
                    const sDate = new Date(s.date);
                    return sDate.getUTCDate() === d.getDate() && sDate.getUTCMonth() === d.getMonth();
                });

                const row = document.createElement('div');
                const isUrgent = matchedShift && matchedShift.shiftType === 'Urgent Care';
                row.className = `shift-row ${matchedShift ? (isUrgent ? 'urgent-care' : 'has-shift') : ''}`;

                const dayNameStr = d.toLocaleDateString('en-US', { weekday: 'short' });
                const monthDayStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                row.innerHTML = `
                    <div class="day-info">
                        <div class="day-name">${dayNameStr}</div>
                        <div class="day-date">${monthDayStr}</div>
                    </div>
                    <div class="shift-details">
                        <div class="shift-type">${matchedShift ? matchedShift.shiftType : 'Off'}</div>
                        <div class="shift-time">${matchedShift ? matchedShift.details : 'No shift scheduled'}</div>
                    </div>
                `;
                scheduleGrid.appendChild(row);
            }
        }

        // Process Voice Transcript
        processBtn.addEventListener('click', async () => {
            const text = transcriptBox.value.trim();
            if (!text) {
                statusMsg.textContent = 'Please record or type your shifts first.';
                return;
            }

            statusMsg.textContent = 'Parsing shifts...';
            try {
                const res = await fetch('/api/parse-voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text, 
                        year: 2026, 
                        month: 7 // August (0-indexed in JS)
                    })
                });
                const data = await res.json();
                if (data.success) {
                    currentShifts = data.shifts;
                    render7DayView();
                    statusMsg.textContent = 'Shifts successfully parsed and saved!';
                    transcriptBox.value = '';
                } else {
                    statusMsg.textContent = 'Error: ' + data.error;
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Failed to connect to server.';
            }
        });

        // Export Calendar
        exportBtn.addEventListener('click', () => {
            window.location.href = '/api/export-calendar';
        });

        // Clear All Shifts
        clearBtn.addEventListener('click', async () => {
            if (!confirm('Clear all saved shifts?')) return;
            try {
                const res = await fetch('/api/update-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shifts: [] })
                });
                const data = await res.json();
                if (data.success) {
                    currentShifts = [];
                    render7DayView();
                    statusMsg.textContent = 'All shifts cleared.';
                }
            } catch (err) {
                console.error(err);
            }
        });

        // Initial load
        fetchSchedule();
    </script>
</body>
</html>
