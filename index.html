<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Schedule Sync & Quick View</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overscroll-behavior-y: none;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-6 md:p-10">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <header class="glass-card rounded-2xl p-6 shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-blue-400">Schedule Sync</h1>
                <p class="text-sm text-slate-400">Quick view & monthly Apple Calendar sync</p>
            </div>
            <div id="current-date-display" class="text-right text-sm font-medium bg-blue-500/10 border border-blue-500/20 text-blue-300 px-4 py-2 rounded-xl">
                Loading date...
            </div>
        </header>

        <section class="glass-card rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Upload Month Screenshots (Part 1 & Part 2)</h2>
            <p class="text-xs text-slate-400">Select your active target month and upload your two schedule screenshots.</p>
            
            <!-- Month & Year Selector -->
            <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 flex items-center justify-between">
                <label class="text-xs font-medium text-slate-300">Target Month & Year:</label>
                <input type="month" id="target-month-input" class="bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Part 1 (First Half)</label>
                    <input type="file" id="schedule-part-1" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Part 2 (Second Half)</label>
                    <input type="file" id="schedule-part-2" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>
            </div>

            <button id="process-btn" onclick="processSchedules()" class="w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30">
                Process & Parse Schedule Grid
            </button>

            <button id="export-btn" onclick="exportCalendar()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/30 hidden">
                Export to Apple Calendar (.ics)
            </button>

            <div id="status-message" class="text-xs text-center text-slate-400 h-auto py-1"></div>
        </section>

        <section class="glass-card rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-200">Parsed Schedule Preview</h2>
                <span class="text-xs text-blue-400 bg-blue-950/50 px-2.5 py-1 rounded-lg border border-blue-800/50">Active View</span>
            </div>
            
            <div id="seven-day-list" class="space-y-3">
                <p class="text-xs text-slate-400 text-center py-4">Upload your screenshots above to populate your schedule preview.</p>
            </div>
        </section>

    </div>

    <script>
        let parsedShiftsGlobal = [];

        // Set default value for month picker to current year-month (e.g., "2026-08")
        const now = new Date();
        const yearStr = now.getFullYear();
        const monthStr = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('target-month-input').value = `${yearStr}-${monthStr}`;

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date-display').innerText = now.toLocaleDateString('en-US', options);

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function getColorStyles(code) {
            switch(code) {
                case 'dark-blue':
                    return { dot: 'bg-indigo-600', badge: 'bg-indigo-950/40 text-indigo-300 border-indigo-800' };
                case 'red':
                    return { dot: 'bg-rose-500', badge: 'bg-rose-950/40 text-rose-300 border-rose-800' };
                case 'yellow':
                    return { dot: 'bg-amber-400', badge: 'bg-amber-950/40 text-amber-300 border-amber-800' };
                case 'light-blue':
                default:
                    return { dot: 'bg-sky-400', badge: 'bg-sky-950/40 text-sky-300 border-sky-800' };
            }
        }

        async function processSchedules() {
            const file1 = document.getElementById('schedule-part-1').files[0];
            const file2 = document.getElementById('schedule-part-2').files[0];
            const monthInputVal = document.getElementById('target-month-input').value;
            const statusEl = document.getElementById('status-message');
            const listContainer = document.getElementById('seven-day-list');
            const exportBtn = document.getElementById('export-btn');

            if (!file1 && !file2) {
                statusEl.innerText = "Please upload at least one schedule image.";
                statusEl.className = "text-xs text-center text-rose-400 h-auto py-1";
                return;
            }

            let targetYear = now.getFullYear();
            let targetMonth = now.getMonth();
            if (monthInputVal) {
                const parts = monthInputVal.split('-');
                targetYear = parseInt(parts[0], 10);
                targetMonth = parseInt(parts[1], 10) - 1;
            }

            statusEl.innerText = "Processing schedule calendar grid via OCR...";
            statusEl.className = "text-xs text-center text-blue-400 h-auto py-1";

            try {
                parsedShiftsGlobal = [];

                if (file1) {
                    const b64_1 = await fileToBase64(file1);
                    const res1 = await fetch('/api/parse-schedule', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageBase64: b64_1, year: targetYear, month: targetMonth })
                    });
                    const data1 = await res1.json();
                    if (!data1.success) throw new Error(data1.error || "Failed part 1");
                    
                    if (data1.shifts && Array.isArray(data1.shifts)) {
                        parsedShiftsGlobal.push(...data1.shifts);
                    }
                }

                if (file2) {
                    const b64_2 = await fileToBase64(file2);
                    const res2 = await fetch('/api/parse-schedule', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageBase64: b64_2, year: targetYear, month: targetMonth })
                    });
                    const data2 = await res2.json();
                    if (!data2.success) throw new Error(data2.error || "Failed part 2");

                    if (data2.shifts && Array.isArray(data2.shifts)) {
                        parsedShiftsGlobal.push(...data2.shifts);
                    }
                }

                if (parsedShiftsGlobal.length > 0) {
                    listContainer.innerHTML = '';
                    parsedShiftsGlobal.forEach((shift, index) => {
                        const styles = getColorStyles(shift.colorCode);
                        const dateFormatted = new Date(shift.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
                        const itemHtml = `
                            <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-800/40 border border-slate-700/50">
                                <div class="flex items-center space-x-3">
                                    <div class="w-3 h-3 rounded-full ${styles.dot}"></div>
                                    <div>
                                        <p class="text-sm font-medium text-slate-200">${dateFormatted} — ${shift.shiftType}</p>
                                        <p class="text-xs text-slate-400">Hours: ${shift.details}</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${styles.badge}">${shift.shiftType}</span>
                                </div>
                            </div>
                        `;
                        listContainer.innerHTML += itemHtml;
                    });
                    exportBtn.classList.remove('hidden');
                } else {
                    listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No shifts detected. Check target month or screenshot quality.</p>';
                }

                statusEl.innerText = "Schedule grid successfully parsed!";
                statusEl.className = "text-xs text-center text-emerald-400 h-auto py-1";

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error: " + err.message;
                statusEl.className = "text-xs text-center text-rose-400 h-auto py-1";
            }
        }

        async function exportCalendar() {
            const statusEl = document.getElementById('status-message');
            try {
                statusEl.innerText = "Generating Apple Calendar export file...";
                statusEl.className = "text-xs text-center text-blue-400 h-auto py-1";

                const response = await fetch('/api/export-calendar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shifts: parsedShiftsGlobal })
                });

                if (!response.ok) throw new Error("Export failed");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'work-schedule.ics';
                document.body.appendChild(a);
                a.click();
                a.remove();

                statusEl.innerText = "Calendar file downloaded successfully!";
                statusEl.className = "text-xs text-center text-emerald-400 h-auto py-1";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Export Error: " + err.message;
                statusEl.className = "text-xs text-center text-rose-400 h-auto py-1";
            }
        }
    </script>
</body>
</html>
