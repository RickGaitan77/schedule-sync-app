<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Schedule Sync</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <style>
    @keyframes pulse-shadow-red {
      0%, 100% {
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        border-color: rgba(239, 68, 68, 0.6);
      }
      50% {
        box-shadow: 0 0 24px rgba(239, 68, 68, 1), inset 0 0 8px rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 1);
      }
    }
    .animate-pulse-shadow-urgent {
      animation: pulse-shadow-red 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .scroll-hide::-webkit-scrollbar {
      display: none;
    }
    .scroll-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    @keyframes audio-wave {
      0%, 100% { height: 6px; opacity: 0.6; }
      50% { height: 24px; opacity: 1; }
    }
    .wave-active {
      animation: audio-wave 1s infinite ease-in-out;
    }
    .wave-delay-0 { animation-delay: 0.0s; }
    .wave-delay-1 { animation-delay: 0.2s; }
    .wave-delay-2 { animation-delay: 0.4s; }
    .wave-delay-3 { animation-delay: 0.1s; }
    .wave-delay-4 { animation-delay: 0.3s; }

    .notch-safe-header {
      padding-top: max(1rem, env(safe-area-inset-top, 16px)) !important;
    }
  </style>
</head>
<body class="min-h-screen bg-[#020617] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#020617] to-black text-slate-200 font-sans selection:bg-emerald-500/30 overflow-x-hidden overflow-y-auto lg:overflow-hidden">
  
  <div id="app" class="max-w-6xl mx-auto flex flex-col min-h-screen lg:h-screen lg:max-h-screen">
    <header class="flex items-center justify-between p-4 sm:p-6 shrink-0 border-b border-slate-800/50 notch-safe-header">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i data-lucide="calendar-sync" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-400">Schedule Sync</h1>
          <p class="text-[10px] font-mono text-slate-500 uppercase tracking-widest">Active Link</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button id="tab-dashboard" onclick="state.activeTab = 'dashboard'; render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-all bg-slate-800 text-white shadow-md">Dashboard</button>
        <button id="tab-schedule" onclick="state.activeTab = 'schedule'; render();" class="px-4 py-2 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">Schedule</button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto lg:overflow-hidden p-2 sm:p-4 lg:p-6" id="main-content">
      <!-- Content renders here -->
    </main>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script>
    let state = {
      shifts: [],
      activeTab: 'dashboard',
      scheduleSubTab: 'working',
      isListening: false,
      isProcessing: false,
      transcript: '',
      statusMsg: '',
      month: (new Date().getMonth() + 1).toString(),
      year: new Date().getFullYear().toString(),
      showQrModal: false,
      showAddModal: false,
      editingShift: null,
      toastMsg: '',
    };

    function generateCompactId() {
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    }

    function persist() {
      try {
        const payload = JSON.stringify(state.shifts);
        localStorage.setItem('vet_shifts_backup', payload);
        localStorage.setItem('schedule_sync_shifts', payload);
      } catch (err) {
        console.error('Storage persistence failed:', err);
      }
    }

    try {
      const saved = localStorage.getItem('vet_shifts_backup') || localStorage.getItem('schedule_sync_shifts');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) state.shifts = parsed;
      }
    } catch(e) {}

    window.addEventListener('storage', (e) => {
      if ((e.key === 'vet_shifts_backup' || e.key === 'schedule_sync_shifts') && e.newValue) {
        try {
          const updated = JSON.parse(e.newValue);
          if (Array.isArray(updated)) {
            state.shifts = updated;
            render();
          }
        } catch (err) {}
      }
    });

    function parseDateParts(isoStr) {
      if (!isoStr) return { y: 2026, m: 1, d: 1, h: 0, min: 0 };
      const [datePart, timePart] = isoStr.replace('Z', '').split('T');
      const [y, m, d] = datePart.split('-').map(Number);
      let h = 0, min = 0;
      if (timePart) {
        const [hh, mm] = timePart.split(':').map(Number);
        h = hh || 0;
        min = mm || 0;
      }
      return { y, m, d, h, min };
    }

    function processSyncHash() {
      const currentHash = window.location.hash;
      if (!currentHash || !currentHash.startsWith('#sync=')) return;

      try {
        const encodedData = currentHash.substring(6);
        const decodedData = decodeURIComponent(encodedData);
        const shiftStrings = decodedData.split('|');

        const restored = shiftStrings.map(str => {
          if (!str) return null;
          const parts = str.split('~');
          let id, dateStr, sTime, eTime, room, colorCode, title;

          if (parts.length >= 7) {
            [id, dateStr, sTime, eTime, room, colorCode, title] = parts;
          } else if (parts.length === 6) {
            const isUrgent = parts[5];
            [id, dateStr, sTime, eTime, room] = parts;
            colorCode = isUrgent === '1' ? 'red' : 'blue';
            title = isUrgent === '1' ? 'Urgent Care' : 'Regular Shift';
          } else if (parts.length === 5) {
            [dateStr, sTime, eTime, room] = parts;
            id = generateCompactId();
            colorCode = 'blue';
            title = 'Regular Shift';
          } else {
            return null;
          }

          return {
            id: id || generateCompactId(),
            start: dateStr + 'T' + sTime,
            end: dateStr + 'T' + eTime,
            title: title || (colorCode === 'red' ? 'Urgent Care' : colorCode === 'amber' ? 'Surgery' : 'Regular Shift'),
            details: room || '',
            colorCode: colorCode || 'blue',
            date: dateStr,
            startTime: sTime,
            endTime: eTime,
            room: room || '',
            urgentCare: colorCode === 'red'
          };
        }).filter(Boolean);

        if (restored.length > 0) {
          state.shifts = restored;
          persist();
          state.toastMsg = `Synced ${restored.length} shift${restored.length === 1 ? '' : 's'} from PC!`;
        } else {
          state.shifts = [];
          persist();
          state.toastMsg = 'Schedule cleared from PC.';
        }

        window.history.replaceState(null, '', window.location.pathname);
        render();
        setTimeout(() => { state.toastMsg = ''; render(); }, 4000);
      } catch (e) {
        console.error('Failed to parse schedule QR code:', e);
      }
    }

    window.addEventListener('hashchange', processSyncHash);
    window.addEventListener('pageshow', processSyncHash);
    processSyncHash();

    function formatTime(rawStr) {
      if (!rawStr) return '';
      const parts = rawStr.split('T');
      if (parts.length !== 2) return rawStr;
      let [h, m] = parts[1].split(':');
      let hInt = parseInt(h, 10);
      let ampm = hInt >= 12 ? 'PM' : 'AM';
      hInt = hInt % 12;
      if (hInt === 0) hInt = 12;
      return `${hInt}:${m} ${ampm}`;
    }

    function renderShiftCard(shift) {
      const { y, m, d } = parseDateParts(shift.start);
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const monthStr = monthNames[m - 1] || '---';
      const dayStr = d.toString().padStart(2, '0');
      
      let borderColorClass = 'border-2 border-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.35)]';
      let textColorClass = 'text-blue-400';
      let label = 'REGULAR';
      let pulseClass = '';
      
      if (shift.colorCode === 'red') {
        borderColorClass = 'border-2 border-red-500';
        textColorClass = 'text-red-400';
        label = 'URGENT';
        pulseClass = 'animate-pulse-shadow-urgent';
      } else if (shift.colorCode === 'amber') {
        borderColorClass = 'border-2 border-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.35)]';
        textColorClass = 'text-amber-400';
        label = 'SURGERY';
      } else if (shift.colorCode === 'violet') {
        borderColorClass = 'border-2 border-purple-400 shadow-[0_0_10px_rgba(192,132,252,0.35)]';
        textColorClass = 'text-purple-400';
        label = 'DROP-OFF';
      }

      const hasRoomInfo = shift.details && /room/i.test(shift.details);

      return `
        <div class="p-2.5 sm:p-4 bg-slate-800/40 rounded-xl flex flex-row items-center gap-3 sm:gap-4 ${borderColorClass} transition-colors group ${pulseClass}">
          <div class="flex flex-col w-12 sm:w-14 min-w-[48px] sm:min-w-[56px] rounded-xl overflow-hidden border border-slate-700/80 shadow-md shrink-0 bg-slate-800/80">
            <div class="bg-red-500/90 text-white text-[8px] sm:text-[9px] font-bold uppercase tracking-widest text-center py-0.5 sm:py-1">
              ${monthStr}
            </div>
            <div class="flex items-center justify-center py-0.5 sm:py-1.5 bg-slate-900/50">
              <span class="text-base sm:text-xl font-bold text-white leading-tight">${dayStr}</span>
            </div>
          </div>
          
          <div class="flex-1 min-w-0 flex flex-col justify-center">
            <div class="flex flex-col sm:flex-row sm:items-center gap-0.5 sm:gap-2">
              <h3 class="text-[13px] sm:text-lg font-medium text-white truncate leading-tight sm:leading-normal">${shift.title}</h3>
              <div class="flex flex-row items-center gap-2">
                ${hasRoomInfo ? `
                  <span class="text-amber-200 bg-amber-400/10 border border-amber-300/30 px-1.5 sm:px-2 py-0.5 rounded text-[9px] sm:text-xs truncate">
                    ${shift.details}
                  </span>
                ` : `
                  ${shift.details ? `<span class="text-slate-400 text-[10px] sm:text-sm truncate sm:border-l sm:border-slate-600 sm:pl-2">
                    ${shift.details}
                  </span>` : ''}
                `}
                <span class="w-max text-[8px] sm:text-[10px] px-1.5 sm:px-2 py-0.5 rounded-full border font-bold uppercase tracking-wider ${textColorClass} bg-current/10 border-current/30">
                  ${label}
                </span>
              </div>
            </div>
            <div class="text-[11px] sm:text-sm font-mono mt-0.5 sm:mt-1 text-emerald-400 leading-tight sm:leading-normal">
              ${formatTime(shift.start)} — ${formatTime(shift.end)}
            </div>
          </div>
          
          <div class="flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 shrink-0 pl-2">
            <button onclick="editShift('${shift.id}')" class="p-2 sm:p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-emerald-400 transition-all shadow-sm" title="Edit Shift">
              <i data-lucide="edit-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </button>
            <button onclick="removeShift('${shift.id}')" class="p-2 sm:p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-red-400 transition-all shadow-sm" title="Delete Shift">
              <i data-lucide="trash-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    function renderDashboard(container) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const allShiftsSorted = [...state.shifts].sort((a, b) => {
        const da = parseDateParts(a.start);
        const db = parseDateParts(b.start);
        return new Date(da.y, da.m - 1, da.d, da.h, da.min) - new Date(db.y, db.m - 1, db.d, db.h, db.min);
      });

      const windowEnd = new Date(today);
      windowEnd.setDate(today.getDate() + 7);
      windowEnd.setHours(23, 59, 59, 999);

      let displayedShifts = allShiftsSorted.filter(s => {
        const p = parseDateParts(s.start);
        const d = new Date(p.y, p.m - 1, p.d, p.h, p.min);
        return d >= today && d <= windowEnd;
      });

      let sectionTitle = "Shift Matrix (Next 7 Days)";
      let badgeLabel = `${displayedShifts.length} UPCOMING`;

      if (displayedShifts.length === 0 && allShiftsSorted.length > 0) {
        displayedShifts = allShiftsSorted.slice(0, 8);
        sectionTitle = "Upcoming Schedule Matrix";
        badgeLabel = `${allShiftsSorted.length} TOTAL SCHEDULED`;
      }

      let shiftsHtml = '';
      if (displayedShifts.length === 0) {
        shiftsHtml = `
          <div class="min-h-[160px] flex flex-col items-center justify-center text-slate-500 py-10">
            <i data-lucide="check-circle-2" class="w-10 h-10 mb-2 opacity-20"></i>
            <p class="font-mono text-xs uppercase tracking-widest text-slate-500 text-center">No shifts entered yet. Tap "+ Add Shift" or dictate on PC.</p>
          </div>
        `;
      } else {
        shiftsHtml = displayedShifts.map(shift => renderShiftCard(shift)).join('');
      }

      let waveHtml = '';
      for(let i=0; i<5; i++) {
        waveHtml += `<div class="w-1 rounded-full transition-all duration-300 ${state.isListening ? 'bg-cyan-400 shadow-[0_0_12px_#22d3ee] wave-active wave-delay-' + i : 'bg-slate-700 h-1.5 opacity-50'}"></div>`;
      }

      container.innerHTML = `
        <div class="min-h-full lg:h-full grid grid-cols-1 lg:grid-cols-12 lg:grid-rows-6 gap-4 sm:gap-6 pb-24 lg:pb-0">
          
          <!-- 1. Schedule Matrix (Visible on phone & PC) -->
          <div class="col-span-1 lg:col-span-8 lg:row-span-6 bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl flex flex-col p-1 shadow-2xl relative overflow-hidden min-h-[340px] shrink-0 lg:shrink">
            <div class="p-3 sm:p-4 border-b border-slate-800/50 flex flex-wrap justify-between items-center gap-2 shrink-0">
              <div class="flex items-center gap-2">
                <h2 class="text-sm font-mono uppercase tracking-widest text-slate-400">${sectionTitle}</h2>
                <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-mono">
                  ${badgeLabel}
                </span>
              </div>
              
              <!-- Direct Action Buttons (Add Shift + Export) -->
              <div class="flex items-center gap-2">
                <button 
                  onclick="openAddModal()" 
                  class="flex items-center gap-1.5 px-3 py-2 bg-slate-800/90 border border-slate-700 hover:border-cyan-400/50 rounded-xl text-cyan-300 hover:bg-slate-800 active:scale-95 text-xs font-mono uppercase font-bold transition-all shadow-sm"
                  title="Manually add a shift"
                >
                  <i data-lucide="plus" class="w-4 h-4 text-cyan-400"></i>
                  <span>Add Shift</span>
                </button>

                <button 
                  onclick="exportCalendar()" 
                  class="flex items-center gap-1.5 px-3.5 py-2 bg-emerald-500/20 border border-emerald-500/40 rounded-xl text-emerald-300 hover:bg-emerald-500/30 active:scale-95 text-xs font-mono uppercase font-bold transition-all shadow-lg shadow-emerald-950/40 ${state.shifts.length === 0 ? 'opacity-40 pointer-events-none' : ''}"
                  title="Add shifts directly to Apple Calendar"
                >
                  <i data-lucide="calendar-plus" class="w-4 h-4 text-emerald-400"></i>
                  <span>Export to Calendar</span>
                </button>
              </div>
            </div>
            
            <div class="flex-1 p-2 sm:p-4 space-y-2 overflow-y-auto max-h-[520px] lg:max-h-none scroll-hide">
              ${shiftsHtml}
            </div>
          </div>

          <!-- 2. PC Dictation Interface (HIDDEN ON PHONE) -->
          <div class="hidden lg:flex col-span-4 row-span-4 bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl p-6 flex-col shadow-2xl relative shrink-0">
            <div class="absolute top-4 right-4">
              <div class="w-2 h-2 rounded-full ${state.isListening ? 'bg-red-500 shadow-[0_0_10px_#ef4444] animate-pulse' : 'bg-violet-500 shadow-[0_0_10px_#a855f7]'}"></div>
            </div>
            <h2 class="text-sm font-mono uppercase tracking-widest text-slate-400 mb-4 shrink-0">PC Dictation Interface</h2>
            <div class="flex-1 flex flex-col gap-4 min-h-[190px]">
              <div class="relative group flex-1 flex flex-col">
                <textarea
                  id="transcript-input"
                  class="w-full h-full min-h-[110px] bg-slate-950/50 border border-slate-800 rounded-2xl p-4 pb-14 text-sm text-slate-200 focus:outline-none focus:border-violet-500/50 transition-all placeholder:text-slate-700 resize-none custom-scrollbar"
                  placeholder="PASTE SCHEDULE DATA OR SPEAK..."
                >${state.transcript}</textarea>
                <div class="absolute bottom-4 right-4 flex gap-2">
                  <button
                    onclick="toggleListening()"
                    class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center transition-all ${state.isListening ? 'text-red-400 border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'text-slate-400 hover:text-white hover:border-violet-500/50'}"
                  >
                    ${state.isListening ? '<i data-lucide="square" class="w-4 h-4 fill-current"></i>' : '<i data-lucide="mic" class="w-5 h-5"></i>'}
                  </button>
                </div>
              </div>
              <button
                onclick="processTranscript()"
                ${state.isProcessing ? 'disabled' : ''}
                class="w-full py-3.5 bg-gradient-to-r from-violet-600 to-emerald-600 rounded-2xl text-white font-bold uppercase tracking-widest text-xs shadow-lg shadow-violet-900/20 active:scale-[0.98] transition-transform disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shrink-0"
              >
                ${state.isProcessing ? '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing Neural Feed' : 'Process Neural Feed'}
              </button>
              ${state.statusMsg ? `<div class="mt-2 text-center text-xs font-mono text-emerald-400 p-2 bg-slate-900/50 rounded border border-emerald-500/20">${state.statusMsg}</div>` : ''}
            </div>
            <div class="mt-4 pt-4 border-t border-slate-800/50 shrink-0">
              <div class="flex items-center justify-center gap-1.5 h-6 mb-2">
                ${waveHtml}
              </div>
              <div class="flex justify-between items-center text-[10px] font-mono text-slate-500 uppercase">
                <span>Memory Buffer</span>
                <span>${(state.transcript.length / 1024).toFixed(3)} KB</span>
              </div>
            </div>
          </div>

          <!-- 3. PC QR Code Generation Hub (HIDDEN ON PHONE) -->
          <div class="hidden lg:flex col-span-4 row-span-2 bg-slate-900/40 backdrop-blur-xl border border-slate-800/50 rounded-3xl p-6 flex-col justify-between shadow-2xl shrink-0">
            <h2 class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-3">Sync to Phone</h2>
            <div class="grid grid-cols-2 gap-3 mt-auto">
              <button 
                onclick="openQrModal()"
                class="flex flex-col items-center gap-2 p-3 bg-slate-800/50 border border-slate-700/50 rounded-xl cursor-pointer group transition-all active:scale-95 hover:border-cyan-400/70 hover:bg-cyan-500/10 hover:shadow-[0_0_12px_rgba(34,211,238,0.3)]"
                title="Display QR code for phone camera"
              >
                <i data-lucide="qr-code" class="w-5 h-5 text-cyan-400 transition-colors"></i>
                <span class="text-[10px] font-mono uppercase text-slate-300 text-center leading-tight">
                  Display QR Code<br/>(For Phone)
                </span>
              </button>

              <button 
                onclick="exportCalendar()"
                class="flex flex-col items-center gap-2 p-3 bg-slate-800/50 border border-slate-700/50 rounded-xl hover:border-emerald-500/50 transition-all group ${state.shifts.length === 0 ? 'opacity-50 pointer-events-none' : ''}"
              >
                <i data-lucide="download" class="w-5 h-5 text-emerald-400 group-hover:scale-110 transition-transform"></i>
                <span class="text-[10px] font-mono uppercase text-slate-300 text-center leading-tight">Download .ICS<br/>(File)</span>
              </button>
            </div>
          </div>
        </div>
      `;

      const ta = document.getElementById('transcript-input');
      if (ta) {
        ta.addEventListener('input', (e) => {
          state.transcript = e.target.value;
          const kb = (state.transcript.length / 1024).toFixed(3);
          const spans = document.querySelectorAll('.text-\\[10px\\].font-mono.text-slate-500.uppercase span');
          if (spans.length > 1) spans[1].innerText = kb + ' KB';
        });
      }
    }

    function renderSchedule(container) {
      const y = parseInt(state.year);
      const m = parseInt(state.month) - 1;
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      
      const monthWorkingShifts = state.shifts.filter(s => {
        const p = parseDateParts(s.start);
        return (p.m - 1) === m && p.y === y;
      }).sort((a,b) => {
        const da = parseDateParts(a.start);
        const db = parseDateParts(b.start);
        return new Date(da.y, da.m - 1, da.d, da.h, da.min) - new Date(db.y, db.m - 1, db.d, db.h, db.min);
      });

      const daysOff = [];
      for(let i=1; i<=daysInMonth; i++) {
        const currentDate = new Date(y, m, i);
        const hasShift = monthWorkingShifts.some(s => {
          const p = parseDateParts(s.start);
          return p.d === i;
        });
        if(!hasShift) {
          daysOff.push(currentDate);
        }
      }

      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      let monthOptions = '';
      months.forEach((name, i) => {
        monthOptions += `<option value="${i+1}" ${state.month == (i+1) ? 'selected' : ''}>${name}</option>`;
      });

      let contentHtml = '';
      if (state.scheduleSubTab === 'working') {
        if (monthWorkingShifts.length === 0) {
          contentHtml = `
            <div class="flex flex-col items-center justify-center text-slate-500 py-20 mt-10">

              let datePart = s.date || '';
              let startTime = s.startTime || '';
              let endTime = s.endTime || '';

              if (s.start && s.start.includes('T')) {

    window.onAddColorChange = function(select) {
      const titleInput = document.getElementById('add-title');
      if (!titleInput) return;
      const color = select.value;
      if (color === 'amber') titleInput.value = 'Surgery';
      else if (color === 'red') titleInput.value = 'Urgent Care';
      else if (color === 'violet') titleInput.value = 'Drop-Offs';
      else if (color === 'blue') titleInput.value = 'Regular Shift';
    };

    window.onEditColorChange = function(select) {
      const titleInput = document.getElementById('edit-title');
      if (!titleInput) return;
      const color = select.value;
      if (color === 'amber') titleInput.value = 'Surgery';
      else if (color === 'red') titleInput.value = 'Urgent Care';
      else if (color === 'violet') titleInput.value = 'Drop-Offs';
      else if (color === 'blue') titleInput.value = 'Regular Shift';
    };

    window.saveNewShift = function(e) {
      e.preventDefault();
      const sVal = document.getElementById('add-start').value;
      const eVal = document.getElementById('add-end').value;

      if (new Date(eVal) <= new Date(sVal)) {
        alert('End time must be after start time.');
        return;
      }

      const chosenColor = document.getElementById('add-color').value;
      const titleVal = document.getElementById('add-title').value.trim() || 'Regular Shift';
      const detailsVal = document.getElementById('add-details').value.trim();
      const sParts = sVal.split('T');

      const newShift = {
        id: generateCompactId(),
        title: titleVal,
        details: detailsVal,
        colorCode: chosenColor,
        start: sVal,
        end: eVal,
        date: sParts[0],
        startTime: sParts[1],
        endTime: eVal.split('T')[1],
        room: detailsVal,
        urgentCare: chosenColor === 'red'
      };

      state.shifts.push(newShift);
      persist();

      state.showAddModal = false;
      state.toastMsg = `Added ${titleVal} to schedule!`;
      render();

      setTimeout(() => {
        state.toastMsg = '';
        render();
      }, 3000);
    };

    window.exportCalendar = function() {
      if (!state.shifts || state.shifts.length === 0) {
        alert('No shifts available to export.');
        return;
      }

      const nowUtc = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ScheduleSync//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
      
      state.shifts.forEach(shift => {
        const start = shift.start.replace(/[-:]/g, '') + '00';
        const end = shift.end.replace(/[-:]/g, '') + '00';
        
        ics += 'BEGIN:VEVENT\r\n';
        ics += `UID:${shift.id}@schedulesync\r\n`;
        ics += `DTSTAMP:${nowUtc}\r\n`;
        ics += `DTSTART:${start}\r\n`;
        ics += `DTEND:${end}\r\n`;
        ics += `SUMMARY:${shift.title}\r\n`;
        ics += `DESCRIPTION:${shift.details || ''}\r\n`;
        ics += 'STATUS:CONFIRMED\r\n';
        ics += 'END:VEVENT\r\n';
      });
      ics += 'END:VCALENDAR';

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `work-schedule.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => window.URL.revokeObjectURL(url), 1000);
    };

    let recognition = null;
    let pendingInterimText = '';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      
      recognition.onresult = (event) => {
        pendingInterimText = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            state.transcript += (state.transcript ? ' ' : '') + event.results[i][0].transcript.trim();
          } else {
            pendingInterimText += event.results[i][0].transcript;
          }
        }
        render();
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
          state.isListening = false;
          render();
        }
      };

      recognition.onend = () => {
        if (pendingInterimText.trim()) {
          state.transcript += (state.transcript ? ' ' : '') + pendingInterimText.trim();
          pendingInterimText = '';
        }
        if (state.isListening) {
          try {
            recognition.start();
            return;
          } catch(e) {}
        }
        state.transcript = state.transcript.trim();
        state.isListening = false;
        render();
      };
    }

    window.toggleListening = function() {
      if (state.isListening) {
        state.isListening = false;
        if (recognition) try { recognition.stop(); } catch(e) {}
      } else {
        if (recognition) {
          try {
            pendingInterimText = '';
            state.isListening = true;
            recognition.start();
          } catch(e) {
            state.isListening = false;
          }
        } else {
          alert('Web Speech API is not supported in this browser.');
        }
      }
      render();
    };

    window.processTranscript = function() {
      if (state.isListening) {
        state.isListening = false;
        if (recognition) try { recognition.stop(); } catch(e) {}
      }

      if (pendingInterimText.trim()) {
        state.transcript += (state.transcript ? ' ' : '') + pendingInterimText.trim();
        pendingInterimText = '';
      }

      if (!state.transcript.trim()) {
        alert('Please dictate or paste your schedule into the box first.');
        return;
      }

      state.isProcessing = true;
      state.statusMsg = 'Processing Neural Feed locally...';
      render();

      setTimeout(() => {
        try {
          let text = state.transcript.toLowerCase();
          
          text = text.replace(/\bto\b/g, '-');
          text = text.replace(/\btill\b/g, '-');
          text = text.replace(/\buntil\b/g, '-');
          text = text.replace(/\bthru\b/g, '-');
          text = text.replace(/\b(?:room|rm|no|number)\s+for\b/g, 'room 4');
          text = text.replace(/\bwon\b/g, '1');
          text = text.replace(/\bone\b/g, '1');
          text = text.replace(/\btoo\b/g, '2');
          text = text.replace(/\btwo\b/g, '2');
          text = text.replace(/\bthree\b/g, '3');
          text = text.replace(/\bfour\b/g, '4');
          text = text.replace(/\bfive\b/g, '5');

          const dateRegex = /\b(?:(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember|t)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+\d{1,2}(?:st|nd|rd|th)?|\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?|(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)(?:\s+the)?\s+\d{1,2}(?:st|nd|rd|th)?|(?:on\s+)?(?:the\s+)?\d{1,2}(?:st|nd|rd|th))\b/gi;

          let matches = [...text.matchAll(dateRegex)];
          let chunks = [];
          
          const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          if (rawLines.length > 1) {
            chunks = rawLines;
          } else if (matches.length > 0) {
            if (matches[0].index > 0) {
              let preText = text.substring(0, matches[0].index).trim();
              if (preText.length > 5) chunks.push(preText);
            }
            for (let i = 0; i < matches.length; i++) {
              let start = matches[i].index;
              let end = (i + 1 < matches.length) ? matches[i+1].index : text.length;
              chunks.push(text.substring(start, end));
            }
          } else {
            chunks.push(text);
          }

          const currentYear = parseInt(state.year) || new Date().getFullYear();
          let currentMonth = parseInt(state.month) - 1;
          let newShiftsCount = 0;
          let skippedCount = 0;

          chunks.forEach(chunk => {
            chunk = chunk.trim();
            if (!chunk) return;

            let day = null;
            
            const monthMatch = chunk.match(/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember|t)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/i);
            if (monthMatch) {
              const mStr = monthMatch[1].toLowerCase();
              const monthMap = { jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3, may:4, jun:5, june:5, jul:6, july:6, aug:7, august:7, sep:8, sept:8, september:8, oct:9, october:9, nov:10, november:10, dec:11, december:11 };
              if (monthMap[mStr] !== undefined) currentMonth = monthMap[mStr];
            } else {
               const numMatch = chunk.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
               if (numMatch) currentMonth = parseInt(numMatch[1]) - 1;
            }

            const numMatch = chunk.match(/\b\d{1,2}[\/\-](\d{1,2})(?:[\/\-]\d{2,4})?\b/);
            const ordinalMatch = chunk.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i);
            const plainDayMatch = chunk.match(/\b(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember|t)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+(\d{1,2})\b/i);

            if (numMatch) day = parseInt(numMatch[1]);
            else if (ordinalMatch) day = parseInt(ordinalMatch[1]);
            else if (plainDayMatch) day = parseInt(plainDayMatch[1]);

            const timeMatch = chunk.match(/\b(\d{1,2})(?::?(\d{2}))?\s*(am|pm|a|p)?\s*-\s*(\d{1,2})(?::?(\d{2}))?\s*(am|pm|a|p)?\b/i);

            if (!timeMatch) {
              if (day !== null || chunk.length > 8) skippedCount++;
              return;
            }
            
            if (day === null) day = new Date().getDate();

            let startH = parseInt(timeMatch[1], 10);
            let startM = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;
            let startPeriod = timeMatch[3] ? timeMatch[3].toLowerCase() : null;
            
            let endH = parseInt(timeMatch[4], 10);
            let endM = timeMatch[5] ? parseInt(timeMatch[5], 10) : 0;
            let endPeriod = timeMatch[6] ? timeMatch[6].toLowerCase() : null;

            if (isNaN(startH) || isNaN(startM) || isNaN(endH) || isNaN(endM) || isNaN(day)) {
              skippedCount++;
              return;
            }

            const isNightShift = /\b(?:night|overnight|graveyard)\b/i.test(chunk);

            if (isNightShift) {
              if (!startPeriod && startH >= 1 && startH <= 11) startPeriod = 'pm';
              if (!endPeriod && endH >= 1 && endH <= 11) endPeriod = 'am';
            } else {
              if (!startPeriod) {
                if (startH >= 6 && startH <= 11) startPeriod = 'am';
                else if (startH === 12 || startH < 6) startPeriod = 'pm';
              }
              if (!endPeriod) {
                if (endH >= 1 && endH <= 11) endPeriod = 'pm';
                else if (endH === 12) endPeriod = 'pm';
              }
            }
            
            if (startPeriod && startPeriod.startsWith('p') && startH < 12) startH += 12;
            if (startPeriod && startPeriod.startsWith('a') && startH === 12) startH = 0;
            
            if (endPeriod && endPeriod.startsWith('p') && endH < 12) endH += 12;
            if (endPeriod && endPeriod.startsWith('a') && endH === 12) endH = 0;

            let endYear = currentYear;
            let endMonth = currentMonth;
            let endDay = day;

            if ((endH * 60 + endM) < (startH * 60 + startM)) {
              const nextDayDate = new Date(currentYear, currentMonth, day + 1);
              endYear = nextDayDate.getFullYear();
              endMonth = nextDayDate.getMonth();
              endDay = nextDayDate.getDate();
            }

            let details = '';
            const roomMatch = chunk.match(/\broom\s+([a-z0-9]+)\b/i);
            const isoMatch = chunk.match(/\biso\b/i);
            const dentalMatch = chunk.match(/\bdental\b/i);
            const frontDeskMatch = chunk.match(/\bfront desk\b/i);
            
            if (roomMatch) details = 'Room ' + roomMatch[1].toUpperCase();
            else if (isoMatch) details = 'ISO';
            else if (dentalMatch) details = 'Dental';
            else if (frontDeskMatch) details = 'Front Desk';

            let colorCode = 'blue';
            let title = 'Regular Shift';
            
            if (chunk.match(/\b(urgent care|urgent|uc)\b/)) {
              colorCode = 'red';
              title = 'Urgent Care';
            } else if (chunk.match(/\bsurgery\b/)) {
              colorCode = 'amber';
              title = 'Surgery';
            } else if (chunk.match(/\bdrop(?:\s*off|s)?\b/)) {
              colorCode = 'violet';
              title = 'Drop-Offs';
            } else if (chunk.match(/\bexam(s)?\b/)) {
              title = 'Exams';
            }

            const pad = n => n.toString().padStart(2, '0');
            const dateStr = `${currentYear}-${pad(currentMonth + 1)}-${pad(day)}`;
            const sTimeStr = `${pad(startH)}:${pad(startM)}`;
            const eTimeStr = `${pad(endH)}:${pad(endM)}`;
            const startIso = `${dateStr}T${sTimeStr}`;
            const endIso = `${endYear}-${pad(endMonth + 1)}-${pad(endDay)}T${eTimeStr}`;

            state.shifts.push({
              id: generateCompactId(),
              title: title,
              details: details,
              colorCode: colorCode,
              start: startIso,
              end: endIso,
              date: dateStr,
              startTime: sTimeStr,
              endTime: eTimeStr,
              room: details,
              urgentCare: colorCode === 'red'
            });
            newShiftsCount++;
          });

          state.transcript = '';
          state.isProcessing = false;
          state.statusMsg = '';
          
          let toast = `Successfully added ${newShiftsCount} shift${newShiftsCount === 1 ? '' : 's'}.`;
          if (skippedCount > 0) toast += ` (${skippedCount} skipped: missing hours)`;
          state.toastMsg = toast;
          
          persist();
          render();

          setTimeout(() => {
            state.toastMsg = '';
            render();
          }, 4500);

        } catch(err) {
          state.isProcessing = false;
          state.statusMsg = '';
          state.toastMsg = 'Error processing schedule feed.';
          render();
        }
      }, 400);
    };

    window.openQrModal = function() {
      state.showQrModal = true;
      render();
    };

    window.closeQrModal = function() {
      state.showQrModal = false;
      render();
    };

    window.editShift = function(id) {
      state.editingShift = state.shifts.find(s => s.id === id);
      render();
    };

    window.closeEditModal = function() {
      state.editingShift = null;
      render();
    };

    window.removeShift = function(id) {
      state.shifts = state.shifts.filter(s => s.id !== id);
      persist();
      render();
    };

    window.saveEditedShift = function(e) {
      e.preventDefault();
      if (!state.editingShift) return;
      
      const sVal = document.getElementById('edit-start').value;
      const eVal = document.getElementById('edit-end').value;

      if (new Date(eVal) <= new Date(sVal)) {
        alert('End time must be after start time.');
        return;
      }
      
      const chosenColor = document.getElementById('edit-color').value;
      state.editingShift.colorCode = chosenColor;
      state.editingShift.title = document.getElementById('edit-title').value;
      state.editingShift.details = document.getElementById('edit-details').value;
      state.editingShift.start = sVal;
      state.editingShift.end = eVal;

      const sParts = sVal.split('T');
      state.editingShift.date = sParts[0];
      state.editingShift.startTime = sParts[1];
      state.editingShift.endTime = eVal.split('T')[1];
      
      state.shifts = state.shifts.map(s => s.id === state.editingShift.id ? state.editingShift : s);
      persist();
      
      state.editingShift = null;
      render();
    };

    render();
  </script>
</body>
</html>
